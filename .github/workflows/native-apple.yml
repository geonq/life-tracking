name: Native Apple validation

on:
  # CI is intentionally manual while the native validation lane is under
  # active development. This prevents every implementation push/PR update
  # from consuming hosted macOS minutes and generating notification noise.
  workflow_dispatch:
    inputs:
      final_acceptance:
        description: "Apply frozen P0/95%/per-workstream score gates"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-apple-${{ github.ref }}
  cancel-in-progress: true

env:
  # XcodeGen's Homebrew formula is floating. Download the upstream release
  # artifact and verify its digest so generation cannot silently change when
  # Homebrew updates on a hosted runner.
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
  XCODEGEN_URL: "https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip"

jobs:
  classify:
    name: Classify native changes
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.changes.outputs.native }}
      lanes: ${{ steps.changes.outputs.lanes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect native matrix paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo 'lanes={"include":[{"lane":"ios-logic"},{"lane":"ios-ui"},{"lane":"mac-logic"},{"lane":"mac-ui"},{"lane":"widgets"}]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$RUNNER_TEMP/native-apple-changed-files.txt"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$ACTION" == "synchronize" && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BEFORE_SHA" =~ ^0+$ ]] \
              && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null \
              && [[ "$AFTER_SHA" =~ ^[0-9a-f]{40}$ ]] \
              && git cat-file -e "${AFTER_SHA}^{commit}" 2>/dev/null; then
              # A synchronize event carries the previous head. Diff only the
              # newly pushed commits; base->head would replay old native work.
              git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" > "$changed"
            else
              # opened/reopened has no prior head to compare, so classify the
              # complete PR once from its base to its current head.
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed"
            fi
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git ls-tree -r --name-only "$WORKFLOW_SHA" > "$changed"
          else
            git diff --name-only "$BEFORE_SHA" "$WORKFLOW_SHA" > "$changed"
          fi

          native=false
          while IFS= read -r path; do
            case "$path" in
              ios/*|\
              scripts/lane_manifest.py|\
              scripts/native_lane_manifest.json|\
              scripts/validate_apple_on_mac.sh|\
              scripts/run_prerelease_lanes.sh)
                native=true
                ;;
            esac
          done < "$changed"

          echo "native=$native" >> "$GITHUB_OUTPUT"
          # Automatic PR validation stays deterministic and code-oriented.
          # UI/snapshot lanes are explicit milestone evidence because running
          # the whole suite per implementation push exceeded the hosted job
          # ceiling and generated misleading failed-run notifications.
          echo 'lanes={"include":[{"lane":"ios-logic"},{"lane":"mac-logic"},{"lane":"widgets"}]}' >> "$GITHUB_OUTPUT"

  contract-check:
    name: Registry and source contracts
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run cheap deterministic checks
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
          bash -n scripts/run_prerelease_lanes.sh
          bash -n scripts/validate_apple_on_mac.sh
          python3 -B scripts/validate_acceptance_registry.py
          python3 -B scripts/validate_native_calendar.py
          python3 -B scripts/validate_native_release.py --mode development

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.final_acceptance }}" == "true" ]]; then
            python3 -B scripts/validate_acceptance_registry.py --score
          fi

  apple-lanes:
    name: ${{ matrix.lane }}
    needs: [classify, contract-check]
    if: needs.classify.outputs.native == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify.outputs.lanes) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -euxo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen-${XCODEGEN_VERSION}.zip"
          install_dir="$RUNNER_TEMP/xcodegen-${XCODEGEN_VERSION}"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 1 \
            "$XCODEGEN_URL" -o "$archive"
          echo "$XCODEGEN_SHA256  $archive" | shasum --algorithm 256 --check --strict
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          xcodegen_path="$(find "$install_dir" -type f -name xcodegen -print -quit)"
          test -n "$xcodegen_path"
          chmod +x "$xcodegen_path"
          echo "$(dirname "$xcodegen_path")" >> "$GITHUB_PATH"
          test "$($xcodegen_path version | sed -n 's/.*Version: //p')" = "$XCODEGEN_VERSION"

      - name: Load lane manifest
        id: lane
        run: |
          set -euo pipefail
          python3 -B scripts/lane_manifest.py \
            --lane "${{ matrix.lane }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Generate authoritative Xcode project
        run: |
          set -euo pipefail
          # The generated project is ignored by design. Removing it first makes
          # project.yml the only input that can determine this CI project.
          rm -rf ios/LifeOS.xcodeproj
          xcodegen generate --spec ios/project.yml --project ios --project-root ios
          python3 -B scripts/validate_xcodegen.py \
            --project ios/LifeOS.xcodeproj \
            --spec ios/project.yml \
            --expected-version "$XCODEGEN_VERSION"

      - name: Select an available iPhone simulator
        id: simulator
        if: steps.lane.outputs.platform == 'ios'
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [
              device
              for runtime, entries in data.get("devices", {}).items()
              if "iOS" in runtime
              for device in entries
              if device.get("isAvailable") and "iPhone" in device.get("name", "")
          ]
          preferred = [device for device in devices if device["name"] == "${{ steps.lane.outputs.simulator_name }}"]
          selected = preferred[0] if preferred else (devices[0] if devices else None)
          print(selected["udid"] if selected else "")
          ' )"
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run isolated test lane
        shell: bash
        run: |
          set -o pipefail
          if [[ "${{ steps.lane.outputs.platform }}" == "ios" ]]; then
            destination="id=${{ steps.simulator.outputs.udid }}"
          else
            destination="${{ steps.lane.outputs.destination }}"
          fi
          result="${{ runner.temp }}/${{ steps.lane.outputs.result_path }}"
          log="${{ steps.lane.outputs.log_path }}"
          derived_data="${{ runner.temp }}/${{ steps.lane.outputs.derived_data_path }}"
          rm -rf "$result" "$derived_data"
          IFS=',' read -r -a only_testing <<< "${{ steps.lane.outputs.only_testing }}"
          command=(
            xcodebuild
            -project ios/LifeOS.xcodeproj
            -scheme "${{ steps.lane.outputs.scheme }}"
            -testPlan "${{ steps.lane.outputs.test_plan }}"
            -configuration "${{ steps.lane.outputs.configuration }}"
            -destination "$destination"
            -derivedDataPath "$derived_data"
            -parallel-testing-enabled NO
            -resultBundlePath "$result"
            CODE_SIGNING_ALLOWED=NO
          )
          for target in "${only_testing[@]}"; do
            command+=("-only-testing:$target")
          done
          command+=(test)
          "${command[@]}" | tee "$log"

      - name: Reject empty or canceled test results
        if: always()
        run: |
          set -euo pipefail
          result="${{ runner.temp }}/${{ steps.lane.outputs.result_path }}"
          python3 -B scripts/validate_xcresult.py \
            --result "$result" \
            --minimum-tests "${{ steps.lane.outputs.minimum_tests }}"

      - name: Export iOS UI attachments
        if: always() && matrix.lane == 'ios-ui'
        run: |
          set -euo pipefail
          result="${{ runner.temp }}/${{ steps.lane.outputs.result_path }}"
          mkdir -p "ui-screenshots-${{ matrix.lane }}"
          if [[ -d "$result" ]]; then
            xcrun xcresulttool export attachments \
              --path "$result" \
              --output-path "ui-screenshots-${{ matrix.lane }}"
          fi

      - name: Upload lane artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-apple-${{ matrix.lane }}
          path: |
            ${{ steps.lane.outputs.log_path }}
            ${{ runner.temp }}/${{ steps.lane.outputs.result_path }}
            ui-screenshots-${{ matrix.lane }}
          if-no-files-found: ignore

# The release-only validator is intentionally not wired to public hosted CI.
# A signed local/CI release environment must create an ephemeral xcconfig or
# xcodebuild-settings file and invoke:
#   python3 scripts/validate_native_release.py --mode release --settings-file <path>
# The file must never be committed, logged, or populated with source defaults.
