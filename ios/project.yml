name: LifeOS
options:
  bundleIdPrefix: com.hermes.lifeos
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  Iconoir:
    url: https://github.com/iconoir-icons/iconoir-swift.git
    exactVersion: 7.5.1
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 2
    APP_GROUP_IDENTIFIER: group.com.hermes.lifeos.REPLACE_WITH_TEAM_CONFIGURED_ID
    PROVISIONING_MODE: unknown
targets:
  LifeOS:
    type: application
    platform: iOS
    sources:
      - LifeOS
      - Shared
      - Shared/FitnessMetric.swift
    resources:
      - path: Shared/Resources/Fonts
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hermes.lifeos.app
      INFOPLIST_FILE: LifeOS/Info.plist
      CODE_SIGN_ENTITLEMENTS: LifeOS/LifeOS.entitlements
      # A signed local/CI Release configuration must inject the exact private
      # `.ts.net` host. Missing configuration intentionally fails closed.
      LIFEOS_SYNC_APPROVED_HOSTS: ""
    dependencies:
      - target: LifeOSWidget
        embed: true
      - package: Iconoir
    scheme:
      testTargets: [LifeOSTests, LifeOSUITests]
  LifeOSWidget:
    type: app-extension
    platform: iOS
    sources:
      - LifeOSWidget
      - path: Shared
        excludes: [HealthKit*.swift]
      - Shared/FitnessMetric.swift
    resources:
      - path: Shared/Resources/Fonts
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hermes.lifeos.app.widget
      INFOPLIST_FILE: LifeOSWidget/Info.plist
      CODE_SIGN_ENTITLEMENTS: LifeOSWidget/LifeOSWidget.entitlements
    dependencies:
      - package: Iconoir
  LifeOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LifeOSTests]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hermes.lifeos.tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LifeOS
  LifeOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LifeOSUITests]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hermes.lifeos.uitests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LifeOS
  LifeOSMac:
    type: application
    platform: macOS
    sources:
      - LifeOSMac
      - path: Shared
        excludes: [HealthKit*.swift]
      - Shared/FitnessMetric.swift
      - LifeOS/OverviewView.swift
      - LifeOS/CodexView.swift
      - LifeOS/Usage
      - LifeOS/Settings.swift
      - LifeOS/CalendarView.swift
      - LifeOS/Modules
      - LifeOS/TaxDocumentsView.swift
    resources:
      - path: Shared/Resources/Fonts
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hermes.lifeos.mac
      INFOPLIST_FILE: LifeOSMac/Info.plist
      CODE_SIGN_ENTITLEMENTS: LifeOSMac/LifeOSMac.entitlements
      # Same release gate as iOS; never commit the private MagicDNS hostname.
      LIFEOS_SYNC_APPROVED_HOSTS: ""
    dependencies:
      - target: LifeOSMacWidget
        embed: true
      - package: Iconoir
    scheme:
      testTargets: [LifeOSMacUITests, LifeOSMacSnapshotTests, LifeOSWidgetSnapshotTests]
  LifeOSMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [LifeOSMacUITests]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hermes.lifeos.mac.uitests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LifeOSMac
  LifeOSMacSnapshotTests:
    type: bundle.unit-test
    platform: macOS
    sources: [LifeOSMacSnapshotTests]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hermes.lifeos.mac.snapshottests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LifeOSMac
  LifeOSWidgetSnapshotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - LifeOSWidgetSnapshotTests
      - path: Shared
        excludes: [HealthKit*.swift]
      - Shared/FitnessMetric.swift
      - LifeOSWidget/CalendarWidget.swift
      - LifeOSWidget/UsageWidget.swift
      - LifeOSWidget/NextEventWidget.swift
      - LifeOSWidget/FutureModuleWidgets.swift
    resources:
      - path: Shared/Resources/Fonts
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hermes.lifeos.mac.widget.snapshottests
      GENERATE_INFOPLIST_FILE: YES
      # These tests render widget views from source and do not load an app or
      # extension. Keep both host settings explicitly empty so XcodeGen's
      # unit-test defaults cannot materialize a nonexistent TEST_HOST.
      TEST_HOST: ""
      BUNDLE_LOADER: ""
    dependencies:
      - package: Iconoir
  LifeOSMacWidget:
    type: app-extension
    platform: macOS
    sources:
      - LifeOSMacWidget
      - path: Shared
        excludes: [HealthKit*.swift]
      - Shared/FitnessMetric.swift
      - LifeOSWidget/UsageWidget.swift
      - LifeOSWidget/CalendarWidget.swift
      - LifeOSWidget/NextEventWidget.swift
      - LifeOSWidget/FutureModuleWidgets.swift
    resources:
      - path: Shared/Resources/Fonts
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hermes.lifeos.mac.widget
      INFOPLIST_FILE: LifeOSMacWidget/Info.plist
      CODE_SIGN_ENTITLEMENTS: LifeOSMacWidget/LifeOSMacWidget.entitlements
    dependencies:
      - package: Iconoir

# The target-level schemes above are retained for the legacy local workflow.
# These named lanes are the T0 acceptance surface: each has one checked-in
# test plan and one bounded test-target set, so an xcodebuild invocation cannot
# accidentally widen into a broad UI/visual run.
schemes:
  LifeOSLogic:
    build:
      targets:
        LifeOS: all
        LifeOSTests: [test]
    test:
      config: Debug
      targets: [LifeOSTests]
      testPlans:
        - path: TestPlans/LifeOSLogic.xctestplan
          defaultPlan: true
    management:
      shared: true
      orderHint: 10
  LifeOSUI:
    build:
      targets:
        LifeOS: all
        LifeOSUITests: [test]
    test:
      config: Debug
      targets: [LifeOSUITests]
      testPlans:
        - path: TestPlans/LifeOSUI.xctestplan
          defaultPlan: true
    management:
      shared: true
      orderHint: 20
  LifeOSMacLogic:
    build:
      targets:
        LifeOSMac: all
        LifeOSMacSnapshotTests: [test]
    test:
      config: Debug
      targets: [LifeOSMacSnapshotTests]
      testPlans:
        - path: TestPlans/LifeOSMacLogic.xctestplan
          defaultPlan: true
    management:
      shared: true
      orderHint: 30
  LifeOSMacUI:
    build:
      targets:
        LifeOSMac: all
        LifeOSMacUITests: [test]
    test:
      config: Debug
      # Deliberately only the pointer/UI runner. Headless snapshots and widget
      # snapshots have independent lanes below.
      targets: [LifeOSMacUITests]
      testPlans:
        - path: TestPlans/LifeOSMacUI.xctestplan
          defaultPlan: true
    management:
      shared: true
      orderHint: 40
  LifeOSWidgets:
    build:
      targets:
        LifeOSWidgetSnapshotTests: all
    test:
      config: Debug
      targets: [LifeOSWidgetSnapshotTests]
      testPlans:
        - path: TestPlans/LifeOSWidgets.xctestplan
          defaultPlan: true
    management:
      shared: true
      orderHint: 50
  # Prerelease is orchestrated as two platform-valid schemes. Xcode cannot
  # use one test action to materialize disjoint iOS and macOS products; the
  # runner script invokes these lanes separately.
  LifeOSPrereleaseIOS:
    build:
      targets:
        LifeOS: all
        LifeOSWidget: all
        LifeOSTests: [test]
        LifeOSUITests: [test]
    test:
      config: Release
      targets:
        - LifeOSTests
        - LifeOSUITests
      testPlans:
        - path: TestPlans/LifeOSPrereleaseIOS.xctestplan
          defaultPlan: true
    management:
      shared: true
      orderHint: 60
  LifeOSPrereleaseMac:
    build:
      targets:
        LifeOSMac: all
        LifeOSMacWidget: all
        LifeOSMacSnapshotTests: [test]
        LifeOSMacUITests: [test]
        LifeOSWidgetSnapshotTests: [test]
    test:
      config: Release
      targets:
        - LifeOSMacSnapshotTests
        - LifeOSMacUITests
        - LifeOSWidgetSnapshotTests
      testPlans:
        - path: TestPlans/LifeOSPrereleaseMac.xctestplan
          defaultPlan: true
    management:
      shared: true
      orderHint: 70
